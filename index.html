<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT Firm Simulator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Fixed UI layers ── -->
  <div id="notification-bar"></div>
  <div id="tutorial-overlay"></div>

  <!-- ============================================================
       SCENE: Main Menu
       ============================================================ -->
  <div id="scene-MainMenu" class="scene">
    <!-- Rendered by UI.renderMainMenu() -->
  </div>

  <!-- ============================================================
       SCENE: Company Dashboard
       ============================================================ -->
  <div id="scene-Dashboard" class="scene hidden">
    <!-- Rendered by UI.renderDashboard() -->
  </div>

  <!-- ============================================================
       SCENE: Project Detail
       ============================================================ -->
  <div id="scene-ProjectDetail" class="scene hidden">
    <!-- Rendered by UI.renderProjectDetail() -->
  </div>

  <!-- ============================================================
       SCENE: Team Management
       ============================================================ -->
  <div id="scene-TeamManagement" class="scene hidden">
    <!-- Rendered by UI.renderTeamManagement() -->
  </div>

  <!-- ============================================================
       SCENE: Project Simulation
       ============================================================ -->
  <div id="scene-ProjectSimulation" class="scene hidden">
    <!-- Rendered by UI.renderSimulation() -->
  </div>

  <!-- ============================================================
       SCENE: Project Result
       ============================================================ -->
  <div id="scene-ProjectResult" class="scene hidden">
    <!-- Rendered by UI.renderProjectResult() -->
  </div>

  <!-- ── Scripts ── -->
  <script src="data.js"></script>
  <script src="game.js"></script>

</body>
</html>
